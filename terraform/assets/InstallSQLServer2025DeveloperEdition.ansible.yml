---
- name: Install SQL Server 2025 Developer Edition
  hosts: all
  gather_facts: yes

  vars:
    # SQL Server 2025 Developer Edition download URL
    sql_server_iso_url: "https://download.microsoft.com/download/5/1/4/5145fe04-4d30-4b85-b0d1-39533663a2f1/SQLServer2025-DEV-x64-ENU.iso"
    sql_server_iso_path: "C:\\temp\\SQLServer2025-DEV-x64-ENU.iso"
    sql_server_setup_path: "C:\\temp\\SQLServer2025Setup"
    sql_server_config_file: "C:\\temp\\ConfigurationFile.ini"
    
    # SQL Server Installation Parameters
    sql_instance_name: "MSSQLSERVER"
    sql_features: "SQLENGINE,REPLICATION,FULLTEXT,IS,CONN,BC,SDK,SNAC_SDK"
    sql_sa_password: "YourStrongPassword123!"
    sql_install_shared_dir: "C:\\Program Files\\Microsoft SQL Server"
    sql_install_shared_wow_dir: "C:\\Program Files (x86)\\Microsoft SQL Server"
    sql_instance_dir: "C:\\Program Files\\Microsoft SQL Server"
    sql_data_dir: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Data"
    sql_user_db_dir: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Data"
    sql_user_db_log_dir: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Data"
    sql_backup_dir: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Backup"
    sql_temp_db_dir: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Data"
    sql_temp_db_log_dir: "C:\\Program Files\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQL\\Data"
    sql_collation: "SQL_Latin1_General_CP1_CI_AS"
    
    # SQL Server Service Accounts (using built-in accounts for Developer Edition)
    sql_svc_account: "NT AUTHORITY\\SYSTEM"
    sql_agent_svc_account: "NT AUTHORITY\\SYSTEM"

  tasks:
  - name: Ensure temp directory exists
    ansible.windows.win_file:
      path: "C:\\temp"
      state: directory

  - name: Check if SQL Server is already installed
    ansible.windows.win_service:
      name: "MSSQLSERVER"
    register: sql_service_check
    failed_when: false

  - name: Display SQL Server installation status
    ansible.builtin.debug:
      msg: "SQL Server is {{ 'already installed' if sql_service_check.exists else 'not installed' }}"

  - name: Download SQL Server 2025 Developer Edition ISO
    ansible.windows.win_get_url:
      url: "{{ sql_server_iso_url }}"
      dest: "{{ sql_server_iso_path }}"
      timeout: 3600
    when: not sql_service_check.exists

  - name: Mount SQL Server ISO
    community.windows.win_disk_image:
      image_path: "{{ sql_server_iso_path }}"
      state: present
    register: disk_image_out
    when: not sql_service_check.exists

  - name: Get mounted drive letter
    ansible.builtin.set_fact:
      sql_setup_drive: "{{ disk_image_out.mount_paths[0] }}"
    when: not sql_service_check.exists

  - name: Create SQL Server configuration file
    ansible.windows.win_copy:
      content: |
        ;SQL Server 2025 Configuration File
        [OPTIONS]
        
        ; Specifies a Setup work flow, like INSTALL, UNINSTALL, or UPGRADE.
        ACTION="Install"
        
        ; Specifies features to install
        FEATURES={{ sql_features }}
        
        ; Specifies the Instance Name
        INSTANCENAME="{{ sql_instance_name }}"
        
        ; SQL Server Instance ID
        INSTANCEID="{{ sql_instance_name }}"
        
        ; Accept License Terms
        IACCEPTSQLSERVERLICENSETERMS="True"
        
        ; Quiet mode (no UI)
        QUIET="True"
        
        ; SQL Server system administrator password
        SAPWD="{{ sql_sa_password }}"
        
        ; Security mode (SQL authentication)
        SECURITYMODE="SQL"
        
        ; Add current Windows user as SQL Server Administrator
        SQLSYSADMINACCOUNTS="{{ ansible_user }}"
        
        ; SQL Server service account
        SQLSVCACCOUNT="{{ sql_svc_account }}"
        
        ; SQL Server Agent service account
        AGTSVCACCOUNT="{{ sql_agent_svc_account }}"
        
        ; SQL Server service startup type (Automatic)
        SQLSVCSTARTUPTYPE="Automatic"
        
        ; SQL Server Agent service startup type (Automatic)
        AGTSVCSTARTUPTYPE="Automatic"
        
        ; Installation directories
        INSTALLSHAREDDIR="{{ sql_install_shared_dir }}"
        INSTALLSHAREDWOWDIR="{{ sql_install_shared_wow_dir }}"
        INSTANCEDIR="{{ sql_instance_dir }}"
        
        ; Data directories
        SQLUSERDBDIR="{{ sql_user_db_dir }}"
        SQLUSERDBLOGDIR="{{ sql_user_db_log_dir }}"
        SQLBACKUPDIR="{{ sql_backup_dir }}"
        SQLTEMPDBDIR="{{ sql_temp_db_dir }}"
        SQLTEMPDBLOGDIR="{{ sql_temp_db_log_dir }}"
        
        ; Collation
        SQLCOLLATION="{{ sql_collation }}"
        
        ; Suppress reboot
        SUPPRESSPRIVACYSTATEMENTNOTICE="True"
        
        ; Update settings
        UPDATEENABLED="False"
        
        ; SQL Server Browser service startup type
        BROWSERSVCSTARTUPTYPE="Automatic"
        
        ; Enable TCP/IP protocol
        TCPENABLED="1"
        
        ; Enable Named Pipes protocol
        NPENABLED="1"
      dest: "{{ sql_server_config_file }}"
    when: not sql_service_check.exists

  - name: Install SQL Server 2025 Developer Edition
    ansible.windows.win_package:
      path: "{{ sql_setup_drive }}\\setup.exe"
      arguments: "/ConfigurationFile={{ sql_server_config_file }}"
      state: present
      creates_service: "MSSQLSERVER"
      product_id: "{SQL Server 2025}"
    register: sql_installation
    when: not sql_service_check.exists
    async: 7200
    poll: 30

  - name: Unmount SQL Server ISO
    community.windows.win_disk_image:
      image_path: "{{ sql_server_iso_path }}"
      state: absent
    when: not sql_service_check.exists

  - name: Enable SQL Server TCP/IP protocol via registry
    ansible.windows.win_regedit:
      path: "HKLM:\\SOFTWARE\\Microsoft\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQLServer\\SuperSocketNetLib\\Tcp"
      name: "Enabled"
      data: 1
      type: dword
    when: not sql_service_check.exists

  - name: Set SQL Server TCP port to 1433
    ansible.windows.win_regedit:
      path: "HKLM:\\SOFTWARE\\Microsoft\\Microsoft SQL Server\\MSSQL16.MSSQLSERVER\\MSSQLServer\\SuperSocketNetLib\\Tcp\\IPAll"
      name: "TcpPort"
      data: "1433"
      type: string
    when: not sql_service_check.exists

  - name: Configure Windows Firewall for SQL Server (TCP 1433)
    community.windows.win_firewall_rule:
      name: "SQL Server Database Engine"
      localport: 1433
      action: allow
      direction: in
      protocol: tcp
      state: present
      enabled: yes

  - name: Configure Windows Firewall for SQL Server Browser (UDP 1434)
    community.windows.win_firewall_rule:
      name: "SQL Server Browser"
      localport: 1434
      action: allow
      direction: in
      protocol: udp
      state: present
      enabled: yes

  - name: Restart SQL Server service to apply configuration changes
    ansible.windows.win_service:
      name: "MSSQLSERVER"
      state: restarted
    when: not sql_service_check.exists

  - name: Wait for SQL Server to be fully started
    ansible.windows.win_service:
      name: "MSSQLSERVER"
      state: started
    register: sql_service_status
    until: sql_service_status.state == 'running'
    retries: 10
    delay: 10

  - name: Verify SQL Server installation
    ansible.windows.win_command: >
      sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -Q "SELECT @@VERSION"
    register: sql_version
    failed_when: false
    changed_when: false

  - name: Display SQL Server version
    ansible.builtin.debug:
      msg: "{{ sql_version.stdout_lines }}"
    when: sql_version.rc == 0

  - name: Installation summary
    ansible.builtin.debug:
      msg: |
        SQL Server 2025 Developer Edition installation completed successfully!
        Instance Name: {{ sql_instance_name }}
        SA Password: {{ sql_sa_password }}
        TCP Port: 1433
        Services: SQL Server and SQL Server Agent are running
        Please remember to change the SA password after installation!
    when: not sql_service_check.exists
