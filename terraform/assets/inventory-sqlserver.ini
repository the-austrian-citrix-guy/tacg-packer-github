# Example Inventory File for SQL Server 2025 Installation
# Copy this file and customize it for your environment

# SECURITY RECOMMENDATIONS:
# 1. Use Ansible Vault to encrypt this file:
#    ansible-vault encrypt inventory-sqlserver.ini
# 2. Or use Ansible Vault for just the password:
#    Create a vault file with: ansible_password: YourPassword
#    Then use: ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
# 3. Or use --ask-pass flag when running playbook instead of storing password here

[sqlservers]
# Add your Windows server IP addresses or hostnames here
# Example:
# 192.168.1.100
# sql-server-01.domain.com
# 10.0.0.50

[sqlservers:vars]
# Windows Authentication Settings
ansible_user=Administrator
# SECURITY WARNING: Storing passwords in plain text is not recommended for production
# Consider using ansible-vault, --ask-pass, or other secure credential management
ansible_password=YourWindowsPassword

# WinRM Connection Settings
ansible_connection=winrm
ansible_winrm_transport=basic
ansible_winrm_port=5985
ansible_winrm_server_cert_validation=ignore

# Alternative: Use HTTPS for WinRM (more secure)
# ansible_winrm_transport=certificate
# ansible_winrm_port=5986
# ansible_winrm_server_cert_validation=validate

# For domain-joined servers, you can use domain credentials:
# ansible_user=DOMAIN\Administrator
# ansible_password=YourDomainPassword
